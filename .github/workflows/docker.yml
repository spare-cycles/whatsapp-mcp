name: build-image

# Build and push the two container images to GHCR.
#
# `whatsapp-mcp` used to be one image containing the whole server. It is now two:
#   - ghcr.io/<owner>/whatsapp-api  — Baileys, the store, the media pipeline, the REST surface.
#                                     Stateful.
#   - ghcr.io/<owner>/whatsapp-mcp  — the MCP surface alone. Stateless.
#
# Neither name is derived from the other, and that is the point. The API serves WhatsApp over HTTP
# to anything that speaks HTTP — a web UI, a cron job, another service; the MCP is merely its first
# consumer. Naming it after the MCP would encode a dependency that runs the wrong way and would
# quietly tell an operator the API is an MCP implementation detail.
#
# The MCP keeps the unsuffixed repository name because it is what an MCP client is configured
# against, and renaming it would break every existing client config for no gain.
#
# Both are therefore spelled against `github.repository_owner` rather than `github.repository`:
# the image names are a deliberate choice, not a function of what this repo happens to be called.
#
# Tags: a semver tag push (v1.2.3) -> :1.2.3 + :latest; any main push -> :main + :sha-<short>.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # The same gate `ci.yml` runs, restated here rather than reached for with `workflow_call`.
  # It exists so `needs: check` below can gate publication: a workflow cannot depend on a job in
  # another workflow, and nothing else stops a red tree from being tagged `:latest`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # ffmpeg for the conversion tests, poppler-utils for `pdftotext` — the suite exercises both
      # for real rather than stubbing them, so a runner without either goes red on tests that pass
      # on any developer machine that happens to have them. The API image installs both too.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: pnpm test

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Both images are published or neither is useful — the MCP is a client of the API, and a
      # version skew between them is exactly what the SDK's CONTRACT_VERSION check exists to catch
      # at runtime. `fail-fast: false` so a broken API image does not hide a separately broken MCP
      # one; the two failures are independent and both are worth seeing in a single run.
      fail-fast: false
      matrix:
        include:
          - package: api
            file: packages/api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/whatsapp-api
          - package: mcp
            file: packages/mcp/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/whatsapp-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          # The workspace root, for both images. A workspace install needs the root lockfile,
          # `pnpm-workspace.yaml` and every package manifest, so the two Dockerfiles differ by
          # `file:` and share a context rather than each building from its own directory.
          context: .
          file: ${{ matrix.file }}
          # amd64 only, and no longer for the reason this line used to give: it blamed the
          # whisper.cpp image the Dockerfile copied from, which published no other arch and which
          # left the project when transcription moved to a remote GPU. Nothing technical requires
          # amd64 today — `packages/mcp` in particular is pure Node and would build anywhere.
          # It stays because publishing a second architecture is a visible change to what consumers
          # receive, and making it silently inside a refactor is not the place. Adding
          # `,linux/arm64` here is now all it takes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
